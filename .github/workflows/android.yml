name: Build BAZR Inspector Android (debug)
on:
  push:
    paths:
      - 'android-native/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # v3 attempted to install the retired Android SDK "tools" package.
      - name: Setup Android SDK (supported packages only)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Find Android Gradle project
        shell: bash
        run: |
          if [[ -f android-native/settings.gradle.kts ]]; then
            echo 'APP_DIR=android-native' >> "$GITHUB_ENV"
          elif [[ -f settings.gradle.kts ]]; then
            echo 'APP_DIR=.' >> "$GITHUB_ENV"
          else
            echo 'Cannot find settings.gradle.kts in repo root or android-native/' >&2
            exit 1
          fi
      - name: Check staging API URL
        env:
          BAZR_API_BASE_URL: ${{ vars.BAZR_API_BASE_URL }}
        shell: bash
        run: |
          if [[ "$BAZR_API_BASE_URL" != https://* || "$BAZR_API_BASE_URL" != */ ]]; then
            echo 'Set repository variable BAZR_API_BASE_URL to the complete HTTPS API URL, ending with /'
            exit 1
          fi
      - name: Compile inspector APK
        env:
          BAZR_API_BASE_URL: ${{ vars.BAZR_API_BASE_URL }}
        shell: bash
        run: gradle -p "$APP_DIR" :app:assembleDebug -PBAZR_API_BASE_URL="$BAZR_API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: bazr-inspector-debug
          path: |
            android-native/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
