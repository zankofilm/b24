name: Build BAZR Inspector Android (debug)

on:
  push:
    paths:
      - 'android-native/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazr-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Find Android Gradle project
        shell: bash
        run: |
          if [[ -f android-native/settings.gradle.kts ]]; then
            echo 'APP_DIR=android-native' >> "$GITHUB_ENV"
          elif [[ -f settings.gradle.kts ]]; then
            echo 'APP_DIR=.' >> "$GITHUB_ENV"
          else
            echo 'Cannot find settings.gradle.kts in repo root or android-native/' >&2
            exit 1
          fi
      - name: Validate API base URL
        env:
          BAZR_API_BASE_URL: ${{ vars.BAZR_API_BASE_URL }}
        shell: bash
        run: |
          if [[ "$BAZR_API_BASE_URL" != https://* || "$BAZR_API_BASE_URL" != */ ]]; then
            echo 'Set repository variable BAZR_API_BASE_URL to the complete HTTPS API URL, ending with /'
            exit 1
          fi
      - name: Run unit tests
        env:
          BAZR_API_BASE_URL: ${{ vars.BAZR_API_BASE_URL }}
        run: gradle -p "$APP_DIR" :app:testDebugUnitTest -PBAZR_API_BASE_URL="$BAZR_API_BASE_URL"
      - name: Prepare stable release signing key (optional)
        id: signing
        env:
          BAZR_KEYSTORE_BASE64: ${{ secrets.BAZR_KEYSTORE_BASE64 }}
          BAZR_KEYSTORE_PASSWORD: ${{ secrets.BAZR_KEYSTORE_PASSWORD }}
          BAZR_KEY_ALIAS: ${{ secrets.BAZR_KEY_ALIAS }}
          BAZR_KEY_PASSWORD: ${{ secrets.BAZR_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$BAZR_KEYSTORE_BASE64" && -n "$BAZR_KEYSTORE_PASSWORD" && -n "$BAZR_KEY_ALIAS" && -n "$BAZR_KEY_PASSWORD" ]]; then
            echo "$BAZR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bazr-release.jks"
            echo "BAZR_KEYSTORE_PATH=$RUNNER_TEMP/bazr-release.jks" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build stable signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          BAZR_API_BASE_URL: ${{ vars.BAZR_API_BASE_URL }}
          BAZR_KEYSTORE_PASSWORD: ${{ secrets.BAZR_KEYSTORE_PASSWORD }}
          BAZR_KEY_ALIAS: ${{ secrets.BAZR_KEY_ALIAS }}
          BAZR_KEY_PASSWORD: ${{ secrets.BAZR_KEY_PASSWORD }}
        run: gradle -p "$APP_DIR" :app:assembleRelease -PBAZR_API_BASE_URL="$BAZR_API_BASE_URL"
      - name: Build debug APK (test only; signing key is runner-specific)
        if: steps.signing.outputs.configured != 'true'
        env:
          BAZR_API_BASE_URL: ${{ vars.BAZR_API_BASE_URL }}
        run: gradle -p "$APP_DIR" :app:assembleDebug -PBAZR_API_BASE_URL="$BAZR_API_BASE_URL"
      - name: Upload APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazr-inspector-4.13.1-apk
          path: |
            android-native/app/build/outputs/apk/debug/*.apk
            android-native/app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            android-native/app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
